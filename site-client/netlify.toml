# ══════════════════════════════════════════════════════════════════
# НАСТРОЙКИ NETLIFY ДЛЯ ЭТОГО САЙТА
#
# В настройках сайта на Netlify обязательно добавьте переменную:
#   VITE_API_URL = https://api.вашдомен.com
# (адрес вашего сервера с чатом — сам сервер на Netlify не живёт,
#  подробности в файле NETLIFY.md в корне проекта)
# ══════════════════════════════════════════════════════════════════

[build]
  command = "npm install && npm run build"
  publish = "dist"

# Версия Node для сборки (Vite 6 требует Node 18 и выше)
[build.environment]
  NODE_VERSION = "20"

# Одностраничное приложение: любой адрес открывает index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
