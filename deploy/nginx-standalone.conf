# ══════════════════════════════════════════════════════════════════
# КОНФИГУРАЦИЯ ДЛЯ ОБЫЧНОГО NGINX (без Docker)
#
# 1. Замените olanhightech.com на свой домен по всему файлу
# 2. Скопируйте:  sudo cp nginx-standalone.conf /etc/nginx/sites-available/olan
# 3. Включите:    sudo ln -s /etc/nginx/sites-available/olan /etc/nginx/sites-enabled/
# 4. Проверьте:   sudo nginx -t && sudo systemctl reload nginx
# 5. SSL:         sudo certbot --nginx -d olanhightech.com -d www.olanhightech.com \
#                   -d portal.olanhightech.com -d admin.olanhightech.com -d api.olanhightech.com
#
# Собранные сайты положите в:
#   /var/www/olan/site    ← site-client/dist
#   /var/www/olan/portal  ← portal-staff/dist
#   /var/www/olan/admin   ← admin-panel/dist
# ══════════════════════════════════════════════════════════════════

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ─── Главный сайт ─────────────────────────────────────────────────
server {
  listen 80;
  server_name olanhightech.com www.olanhightech.com;
  root /var/www/olan/site;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ /index.html; }
}

# ─── Кабинеты сотрудников ─────────────────────────────────────────
server {
  listen 80;
  server_name portal.olanhightech.com;
  root /var/www/olan/portal;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
}

# ─── Админ-панель ─────────────────────────────────────────────────
server {
  listen 80;
  server_name admin.olanhightech.com;
  root /var/www/olan/admin;
  index index.html;

  # Ограничение доступа по IP офиса — раскомментируйте при желании:
  # allow 203.0.113.0/24;
  # deny all;

  location / { try_files $uri $uri/ /index.html; }
}

# ─── Сервер: API и онлайн-чат ─────────────────────────────────────
server {
  listen 80;
  server_name api.olanhightech.com;
  client_max_body_size 8M;

  # онлайн-чат работает через постоянное соединение
  location /socket.io/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
